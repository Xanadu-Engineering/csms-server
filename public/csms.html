<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSMS Dashboard - Charging Station Management System</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      h1 {
        color: white;
        text-align: center;
        margin-bottom: 30px;
        font-size: 2.5em;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .stat-card h3 {
        color: #667eea;
        font-size: 0.9em;
        margin-bottom: 10px;
        text-transform: uppercase;
      }

      .stat-card .value {
        font-size: 2em;
        font-weight: bold;
        color: #333;
      }

      .main-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .panel {
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .panel h2 {
        color: #667eea;
        margin-bottom: 20px;
        font-size: 1.5em;
        border-bottom: 2px solid #667eea;
        padding-bottom: 10px;
      }

      .chargers-list {
        max-height: 500px;
        overflow-y: auto;
      }

      .charger-item {
        padding: 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .charger-item:hover {
        border-color: #667eea;
        background: #f8f9ff;
        transform: translateX(5px);
      }

      .charger-item.selected {
        border-color: #667eea;
        background: #f0f3ff;
      }

      .charger-item .charger-id {
        font-weight: bold;
        color: #333;
        font-size: 1.1em;
      }

      .charger-item .charger-status {
        margin-top: 5px;
        font-size: 0.9em;
        color: #666;
      }

      .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 0.85em;
        font-weight: bold;
        margin-left: 10px;
      }

      .status-connected {
        background: #4caf50;
        color: white;
      }

      .status-disconnected {
        background: #f44336;
        color: white;
      }

      .status-charging {
        background: #ff9800;
        color: white;
      }

      .status-available {
        background: #4caf50;
        color: white;
      }

      .status-other {
        background: #9e9e9e;
        color: white;
      }

      .plug-status-badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.85em;
        font-weight: normal;
      }

      .plug-status-badge.plugged {
        background-color: #4caf50;
        color: white;
      }

      .plug-status-badge.unplugged {
        background-color: #9e9e9e;
        color: white;
      }

      .charger-details {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .charger-details h3 {
        color: #667eea;
        margin-bottom: 15px;
      }

      .detail-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #e0e0e0;
      }

      .detail-row:last-child {
        border-bottom: none;
      }

      .detail-label {
        font-weight: bold;
        color: #555;
      }

      .detail-value {
        color: #333;
      }

      .command-section {
        margin-top: 20px;
      }

      .command-group {
        margin-bottom: 15px;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 8px;
      }

      .command-group h4 {
        color: #667eea;
        margin-bottom: 10px;
        font-size: 1em;
      }

      .command-form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      input,
      select {
        padding: 8px 12px;
        border: 2px solid #e0e0e0;
        border-radius: 6px;
        font-size: 0.9em;
        transition: border-color 0.3s;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
      }

      button {
        padding: 10px 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      .refresh-btn {
        background: #4caf50;
        margin-bottom: 15px;
      }

      .response-log {
        max-height: 300px;
        overflow-y: auto;
        background: #1e1e1e;
        color: #fff;
        padding: 15px;
        border-radius: 8px;
        font-family: "Courier New", monospace;
        font-size: 0.9em;
        line-height: 1.6;
      }

      .log-entry {
        margin-bottom: 10px;
        padding: 8px;
        border-left: 3px solid #667eea;
        background: rgba(255, 255, 255, 0.05);
      }

      .log-timestamp {
        color: #888;
        font-size: 0.85em;
      }

      .log-success {
        border-left-color: #4caf50;
      }

      .log-error {
        border-left-color: #f44336;
      }

      .empty-state {
        text-align: center;
        padding: 40px;
        color: #888;
      }

      .empty-state-icon {
        font-size: 3em;
        margin-bottom: 10px;
      }

      @media (max-width: 1024px) {
        .main-content {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>⚡ CSMS Dashboard</h1>

      <div class="stats">
        <div class="stat-card">
          <h3>Connected Chargers</h3>
          <div class="value" id="connectedCount">0</div>
        </div>
        <div class="stat-card">
          <h3>Total Chargers</h3>
          <div class="value" id="totalCount">0</div>
        </div>
        <div class="stat-card">
          <h3>Last Updated</h3>
          <div class="value" id="lastUpdate" style="font-size: 1.2em">
            Never
          </div>
        </div>
      </div>

      <div class="main-content">
        <div class="panel">
          <h2>📡 Connected Chargers</h2>
          <button class="refresh-btn" onclick="refreshChargers()">
            🔄 Refresh List
          </button>
          <div class="chargers-list" id="chargersList">
            <div class="empty-state">
              <div class="empty-state-icon">🔌</div>
              <p>No chargers connected</p>
              <p style="font-size: 0.9em; margin-top: 10px">
                Make sure the Central System is running
              </p>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>🎛️ Charger Control</h2>
          <div id="controlPanel">
            <div class="empty-state">
              <div class="empty-state-icon">👈</div>
              <p>Select a charger to control</p>
            </div>
          </div>
        </div>
      </div>

      <div class="panel" style="margin-top: 20px">
        <h2>📋 Response Log</h2>
        <div class="response-log" id="responseLog">
          <div class="log-entry">
            <span class="log-timestamp">[System]</span> CSMS Dashboard ready.
            Waiting for commands...
          </div>
        </div>
      </div>
    </div>

    <script>
      let selectedCharger = null
      let chargers = []

      async function refreshChargers() {
        try {
          const response = await fetch("/api/chargers")
          const data = await response.json()
          chargers = data.chargers

          document.getElementById("connectedCount").textContent = data.count
          document.getElementById("totalCount").textContent = data.count

          if (data.lastUpdate) {
            const updateTime = new Date(data.lastUpdate)
            document.getElementById("lastUpdate").textContent =
              updateTime.toLocaleTimeString()
          }

          renderChargersList()
          logMessage("success", `Refreshed: ${data.count} charger(s) found`)
        } catch (error) {
          logMessage("error", `Failed to fetch chargers: ${error.message}`)
        }
      }

      function renderChargersList() {
        const container = document.getElementById("chargersList")

        if (chargers.length === 0) {
          container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔌</div>
                        <p>No chargers connected</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">Make sure the Central System is running</p>
                    </div>
                `
          return
        }

        container.innerHTML = chargers
          .map(
            (charger) => `
                <div class="charger-item ${
                  selectedCharger?.id === charger.id ? "selected" : ""
                }" 
                     onclick="selectCharger('${charger.id}')">
                    <div class="charger-id">
                        ${charger.id}
                        <span class="status-badge status-connected">Connected</span>
                    </div>
                    <div class="charger-status">
                        Connected since: ${new Date(
                          charger.connectedAt
                        ).toLocaleString()}
                    </div>
                </div>
            `
          )
          .join("")
      }

      function selectCharger(chargerId) {
        selectedCharger = chargers.find((c) => c.id === chargerId)
        renderChargersList()
        renderControlPanel().then(() => {
          // Update button state after panel is rendered
          updateStartButtonState()
        })
        logMessage("info", `Selected charger: ${chargerId}`)
      }

      let connectorData = {}

      async function renderControlPanel() {
        const container = document.getElementById("controlPanel")

        if (!selectedCharger) {
          container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">👈</div>
                        <p>Select a charger to control</p>
                    </div>
                `
          return
        }

        // Fetch connector status
        try {
          const response = await fetch(`/api/chargers/${selectedCharger.id}/connectors`)
          const data = await response.json()
          connectorData = {}
          if (data.connectors) {
            data.connectors.forEach(conn => {
              connectorData[conn.connectorId] = conn
            })
          }
        } catch (error) {
          console.error("Error fetching connector status:", error)
        }

        // Build connector status HTML
        const connectorsHtml = Object.keys(connectorData).length > 0
          ? Object.values(connectorData).map(conn => {
              const plugStatus = conn.pluggedIn ? '🔌 Plugged In' : '🔌 Not Plugged'
              const plugClass = conn.pluggedIn ? 'plugged' : 'unplugged'
              return `
                <div class="detail-row" style="border-bottom: 1px solid #e0e0e0; padding: 10px 0;">
                  <div>
                    <strong>Connector ${conn.connectorId}</strong>
                    <span class="status-badge ${conn.state === 'Charging' ? 'status-charging' : conn.state === 'Available' ? 'status-available' : 'status-other'}" style="margin-left: 10px;">${conn.state || 'Unknown'}</span>
                    <span class="plug-status-badge ${plugClass}" style="margin-left: 10px;">${plugStatus}</span>
                  </div>
                  ${conn.transactionId ? `<div style="font-size: 0.9em; color: #666; margin-top: 5px;">Transaction ID: ${conn.transactionId}</div>` : ''}
                </div>
              `
            }).join('')
          : '<div class="detail-row">No connector status available</div>'

        container.innerHTML = `
                <div class="charger-details">
                    <h3>Charger Details</h3>
                    <div class="detail-row">
                        <span class="detail-label">Charger ID:</span>
                        <span class="detail-value">${selectedCharger.id}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Connected At:</span>
                        <span class="detail-value">${new Date(
                          selectedCharger.connectedAt
                        ).toLocaleString()}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Status:</span>
                        <span class="detail-value"><span class="status-badge status-connected">Connected</span></span>
                    </div>
                </div>

                <div class="charger-details" style="margin-top: 20px;">
                    <h3>Connector Status</h3>
                    ${connectorsHtml}
                </div>

                <div class="command-section">
                    <div class="command-group">
                        <h4>🔋 Remote Start Transaction</h4>
                        <div class="command-form">
                            <input type="text" id="startIdTag" placeholder="ID Tag" value="REMOTE-START-TAG">
                            <input type="number" id="startConnector" placeholder="Connector ID" value="1" min="1" onchange="updateStartButtonState()">
                            <button id="startChargingBtn" onclick="sendRemoteStart()">Start Charging</button>
                        </div>
                        <div id="startButtonMessage" style="font-size: 0.85em; margin-top: 5px; color: #666;"></div>
                    </div>

                    <div class="command-group">
                        <h4>⏹️ Remote Stop Transaction</h4>
                        <div class="command-form">
                            <input type="number" id="stopTransactionId" placeholder="Transaction ID" min="1">
                            <button onclick="sendRemoteStop()">Stop Charging</button>
                        </div>
                    </div>

                    <div class="command-group">
                        <h4>🔓 Unlock Connector</h4>
                        <div class="command-form">
                            <input type="number" id="unlockConnector" placeholder="Connector ID" value="1" min="1">
                            <button onclick="sendUnlock()">Unlock</button>
                        </div>
                    </div>

                    <div class="command-group">
                        <h4>🔄 Reset Charger</h4>
                        <div class="command-form">
                            <select id="resetType">
                                <option value="Soft">Soft Reset</option>
                                <option value="Hard">Hard Reset</option>
                            </select>
                            <button onclick="sendReset()">Reset</button>
                        </div>
                    </div>

                    <div class="command-group">
                        <h4>⚙️ Change Configuration</h4>
                        <div class="command-form">
                            <input type="text" id="configKey" placeholder="Key" value="HeartbeatInterval">
                            <input type="text" id="configValue" placeholder="Value" value="60">
                            <button onclick="sendChangeConfiguration()">Change</button>
                        </div>
                    </div>

                    <div class="command-group">
                        <h4>📖 Get Configuration</h4>
                        <div class="command-form">
                            <input type="text" id="getConfigKey" placeholder="Key (optional)">
                            <button onclick="sendGetConfiguration()">Get Config</button>
                        </div>
                    </div>
                </div>
            `
      }

      function updateStartButtonState() {
        const connectorId = parseInt(document.getElementById("startConnector")?.value || "1")
        const btn = document.getElementById("startChargingBtn")
        const msg = document.getElementById("startButtonMessage")
        
        if (!btn || !msg) return

        const connector = connectorData[connectorId]
        if (connector && connector.pluggedIn) {
          btn.disabled = false
          btn.title = ""
          msg.textContent = "Ready to start charging"
          msg.style.color = "#4caf50"
        } else {
          btn.disabled = true
          btn.title = "EV must be plugged in to start charging"
          msg.textContent = "EV must be plugged in before starting charging"
          msg.style.color = "#f44336"
        }
      }

      async function sendRemoteStart() {
        const idTag = document.getElementById("startIdTag").value
        const connectorId = parseInt(
          document.getElementById("startConnector").value
        )

        await sendCommand(
          "remote-start",
          { idTag, connectorId },
          "Remote Start Transaction"
        )
        // Refresh connector status after starting
        if (selectedCharger) {
          renderControlPanel()
        }
      }

      async function sendRemoteStop() {
        const transactionId = parseInt(
          document.getElementById("stopTransactionId").value
        )

        if (!transactionId) {
          logMessage("error", "Transaction ID is required")
          return
        }

        await sendCommand(
          "remote-stop",
          { transactionId },
          "Remote Stop Transaction"
        )
      }

      async function sendUnlock() {
        const connectorId = parseInt(
          document.getElementById("unlockConnector").value
        )
        await sendCommand("unlock", { connectorId }, "Unlock Connector")
      }

      async function sendReset() {
        const type = document.getElementById("resetType").value
        await sendCommand("reset", { type }, "Reset")
      }

      async function sendChangeConfiguration() {
        const key = document.getElementById("configKey").value
        const value = document.getElementById("configValue").value
        await sendCommand(
          "change-configuration",
          { key, value },
          "Change Configuration"
        )
      }

      async function sendGetConfiguration() {
        const key = document.getElementById("getConfigKey").value
        await sendCommand(
          "get-configuration",
          { key: key || undefined },
          "Get Configuration"
        )
      }

      async function sendCommand(endpoint, payload, commandName) {
        if (!selectedCharger) {
          logMessage("error", "No charger selected")
          return
        }

        logMessage("info", `Sending ${commandName} to ${selectedCharger.id}...`)

        try {
          const response = await fetch(
            `/api/chargers/${selectedCharger.id}/${endpoint}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            }
          )

          const data = await response.json()

          if (response.ok) {
            logMessage(
              "success",
              `${commandName} response: ${JSON.stringify(data)}`
            )
          } else {
            logMessage(
              "error",
              `${commandName} failed: ${JSON.stringify(data)}`
            )
          }
        } catch (error) {
          logMessage("error", `${commandName} error: ${error.message}`)
        }
      }

      function logMessage(type, message) {
        const log = document.getElementById("responseLog")
        const timestamp = new Date().toLocaleTimeString()
        const typeClass =
          type === "success"
            ? "log-success"
            : type === "error"
            ? "log-error"
            : ""

        const entry = document.createElement("div")
        entry.className = `log-entry ${typeClass}`
        entry.innerHTML = `
                <span class="log-timestamp">[${timestamp}]</span> ${message}
            `

        log.appendChild(entry)
        log.scrollTop = log.scrollHeight
      }

      // Auto-refresh every 5 seconds
      setInterval(() => {
        refreshChargers()
        // Also refresh control panel if a charger is selected
        if (selectedCharger) {
          renderControlPanel().then(() => {
            updateStartButtonState()
          })
        }
      }, 5000)

      // Initial load
      refreshChargers()
    </script>
  </body>
</html>
