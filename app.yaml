name: csms-server
region: nyc
services:
  - name: api
    github:
      repo: your-username/your-repo-name
      branch: main
      deploy_on_push: true
    run_command: npm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: USE_SAME_PORT
        value: "true"
      - key: HOST
        value: "0.0.0.0"
    routes:
      - path: /

